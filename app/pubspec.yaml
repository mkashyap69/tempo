name: tempo
description: Personal recovery/strain app for the Mi Band 6.
publish_to: none
version: 0.0.1+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  band_ble:
    path: ../packages/band_ble
  flutter_blue_plus: ^2.3.13
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  fl_chart: ^1.2.0
  workmanager: ^0.10.10
  store:
    path: ../packages/store
  scoring:
    path: ../packages/scoring

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
