name: tempo
description: Personal recovery/strain app for the Mi Band 6.
publish_to: none
version: 0.0.1+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  band_ble:
    path: ../packages/band_ble
  flutter_blue_plus: ^2.3.13
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  workmanager: ^0.10.10
  store:
    path: ../packages/store
  scoring:
    path: ../packages/scoring
  intl: ^0.20.3
  share_plus: ^13.3.1
  flutter_local_notifications: ^22.3.1
  home_widget: ^0.10.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Light.ttf
          weight: 300
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
